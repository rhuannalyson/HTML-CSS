<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>

<body>
    <h1>Exemplos de formulários:</h1>
    <form action="cadastros.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="masculino"> <label for="isxmas">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfem" value="feminino"> <label for="isxfem">Feminino</label>
        </fieldset>
        <!-- Todo botão de rádio que faz parte do mesmo grupo precisam ter o mesmo nome, porém com id diferente! -->

        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esvolei" id="iesvolei"> <label for="iesvolei">Vôlei</label> <br>
            <input type="checkbox" name="esteni" id="iesteni"> <label for="iesteni">Tênis</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
            <input type="checkbox" name="outro" id="ioutro"> <label for="ioutro">Outro</label>
        </fieldset>
        <!-- Cada checkbox pode ter nome diferente, pois são independentes -->

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
