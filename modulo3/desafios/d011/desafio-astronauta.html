<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Astronauta</title>
    <style>
          * {
            margin: 0px;
            padding: 0px;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: black;
        }

        body {
            background: url('imagens/espaco.jpg') no-repeat top center;
            background-size: cover;
            background-attachment: fixed;
        }

        main {
            height: 100vh;
            position: relative;
        }

        section#astronauta {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 45vw;
            aspect-ratio: 1/1;
            max-height: 1000px;
            max-width: 1000px;
            
            background-color: blueviolet;
            background: url('imagens/astronauta.png') no-repeat center center;
            background-size: contain;
        }
    </style>
</head>
<body>
    <main>
        <section id="espaço">

        </section>
        <section id="astronauta">

        </section>
    </main>
</body>
</html>
